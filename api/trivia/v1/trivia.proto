syntax = "proto3";

package trivia.v1;

import "rbt/v1alpha1/options.proto";
import "google/protobuf/timestamp.proto";

message Question {
  string question = 1;
  repeated string potential_answers = 2;
}

enum GameStatus {
  QUESTION_RUNNING = 0;
  COOLDOWN = 1;
}

message Game {
  option (rbt.v1alpha1.state) = {
  };

  // The current status of the game.
  GameStatus status = 1;

  // The current Question.
  Question question = 2;

  // The correct answer to the Question
  uint32 correct_answer_idx = 3;

  // User's answers for the current Question.
  map<string, uint32> answers = 4;

  // Absolute time when the Game will move to the next status.
  google.protobuf.Timestamp next_status = 5;

  // All players (could also be managed by `Presence`).
  repeated string players = 6;

  // A "tick" value which we use to force re-rendering of the visible state
  // as time passes.
  // TODO: Rather than ticking like this, ideally we'd only send the remaining
  // time when the state has changed for some other reason. But this avoids
  // needing to interpolate the state on the client side.
  uint64 tick = 7;
}

service GameMethods {
  rpc AddPlayer(AddPlayerRequest) returns (AddPlayerResponse) {
    option (rbt.v1alpha1.method).writer = {};
  }

  // Answer a question on behalf of a player.
  rpc Answer(AnswerRequest) returns (AnswerResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // Gets the current visible game state (the part that this player can see).
  // Guarantees to "tick"/update a few times a second (in practice would
  // interpolate).
  rpc VisibleState(VisibleStateRequest) returns (VisibleStateResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  // The game loop: updates the status, and additionally "ticks" the game to
  // force rendering.
  // TODO: Consider using interpolation on the client.
  rpc Ticker(TickerRequest) returns (TickerResponse) {
    option (rbt.v1alpha1.method).workflow = {
    };
  }
}

message AddPlayerRequest {
  string player_name = 1;
}

message AddPlayerResponse {}

message AnswerRequest {
  string player_name = 1;
  string question = 2;
  uint32 answer_index = 3;
}

message AnswerResponse {}

message VisibleStateRequest {
  string player_name = 1;
}

message VisibleStateResponse {
  // The current status of the game.
  GameStatus status = 1;

  // The current Question.
  Question question = 2;

  // The correct answer to the Question IF we are in the cooldown status
  // between questions.
  optional uint32 correct_answer_idx = 3;

  // The relative time in milliseconds until the game moves to the next status.
  uint32 remaining_milliseconds = 5;
}

message TickerRequest {}

message TickerResponse {}
